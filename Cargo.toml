[package]
name = "rvt_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rvt_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
flate2 = "1"
rayon = "1"
memchr = "2"
rustc-hash = "2"
memmap2 = "0.9"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
